<!doctype html>
<html>
<head><meta charset="utf-8"><title>rx worker test</title></head>
<body>
<pre id="out">running…</pre>
<script>
const out = document.getElementById('out');
const w = new Worker('rx-test-worker.js', { name: 'rx-test' });
w.onmessage = (e) => {
  if (e.data.type === 'log') out.textContent = e.data.text;
  if (e.data.type === 'done') {
    out.textContent += '\n\nDONE\n' + JSON.stringify(e.data, null, 2);
    window.__RXRESULT = e.data;
  }
};
w.onerror = (e) => { out.textContent += '\nworker error ' + (e.message || e); window.__RXRESULT = { error: String(e.message || e) }; };
</script>
</body>
</html>
